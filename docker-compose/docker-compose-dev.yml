version: '3.6'

# Development Docker Compose - starts only infrastructure dependencies.
# Run application services locally (via IDE or ./gradlew bootRun) for hot-reload.
#
# Usage:
#   cd docker-compose
#   docker-compose -f docker-compose-dev.yml up -d
#
# Swagger UI URLs (when services are running locally):
#   Core Banking:       http://localhost:8092/swagger-ui.html
#   User Service:       http://localhost:8083/swagger-ui.html
#   Fund Transfer:      http://localhost:8084/swagger-ui.html
#   Utility Payment:    http://localhost:8085/swagger-ui.html
#
# OpenAPI JSON:
#   Core Banking:       http://localhost:8092/api-docs
#   User Service:       http://localhost:8083/api-docs
#   Fund Transfer:      http://localhost:8084/api-docs
#   Utility Payment:    http://localhost:8085/api-docs

services:

  zipkin:
    image: openzipkin/zipkin:3
    container_name: openzipkin_server
    ports:
      - "9411:9411"
    networks:
      javatodev_ib_network:
        ipv4_address: 172.25.0.12

  keycloak_web:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: keycloak_web
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloakdb:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-password}
    command: ["start-dev", "--import-realm"]
    depends_on:
      - keycloakdb
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      javatodev_ib_network:
        ipv4_address: 172.25.0.11
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3;cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloakdb:
    image: postgres:15
    container_name: keycloak_postgre_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
    networks:
      javatodev_ib_network:
        ipv4_address: 172.25.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql_core_db:
    build: mysql
    container_name: mysql_javatodev_app
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-woVERANKliGharym}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      javatodev_ib_network:
        ipv4_address: 172.25.0.9
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
      javatodev_ib_network:
        ipv4_address: 172.25.0.13
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mysqldata:

networks:
  javatodev_ib_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
