# MySQL Profile Configuration (Production)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ridesharingdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Disable H2 Console in production
  h2:
    console:
      enabled: false
