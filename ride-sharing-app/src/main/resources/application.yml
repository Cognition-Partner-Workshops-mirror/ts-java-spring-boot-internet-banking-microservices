# Ride Sharing Application Configuration
spring:
  application:
    name: ride-sharing-app

  # H2 Database Configuration (Development)
  datasource:
    url: jdbc:h2:mem:ridesharingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # H2 Console (Development only)
  h2:
    console:
      enabled: true
      path: /h2-console

# Server Configuration
server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: RideShareSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!
    expiration-ms: 86400000  # 24 hours

  # Ride Configuration
  ride:
    base-fare: 50.0           # Base fare in currency units
    per-km-rate: 12.0         # Rate per kilometer
    per-minute-rate: 2.0      # Rate per minute of travel
    surge-multiplier: 1.0     # Default surge multiplier (1.0 = no surge)
    max-surge-multiplier: 3.0 # Maximum allowed surge multiplier
    search-radius-km: 5.0     # Radius to search for nearby drivers

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Logging Configuration
logging:
  level:
    com.ridesharing: DEBUG
    org.springframework.security: INFO
