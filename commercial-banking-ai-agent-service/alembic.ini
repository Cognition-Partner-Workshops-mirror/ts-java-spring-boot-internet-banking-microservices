# Alembic configuration for the Commercial Banking AI Agent Service
# Used for database schema versioning and migrations

[alembic]
# Path to migration scripts directory
script_location = alembic

# Connection URL is overridden at runtime by alembic/env.py from app settings
sqlalchemy.url = mysql+pymysql://%(DB_USER)s:%(DB_PASSWORD)s@localhost:3306/banking_ai_agent_service

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
