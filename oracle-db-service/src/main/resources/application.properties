# =============================================================================
# Oracle Database Service - Application Configuration
# =============================================================================

# Application name used for service identification
spring.application.name=oracle-db-service

# Server port for the Oracle DB service
server.port=8085

# =============================================================================
# Oracle Database Connection Configuration
# =============================================================================
# JDBC URL format: jdbc:oracle:thin:@<host>:<port>:<SID> or
#                  jdbc:oracle:thin:@//<host>:<port>/<service_name>
# Update these values to match your Oracle Database instance
# Set these via environment variables: ORACLE_DB_URL, ORACLE_DB_USERNAME, ORACLE_DB_PASSWORD
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# =============================================================================
# HikariCP Connection Pool Configuration
# =============================================================================
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=10
# Minimum number of idle connections maintained in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum time (ms) a client will wait for a connection from the pool
spring.datasource.hikari.connection-timeout=30000
# Maximum time (ms) a connection can remain idle in the pool
spring.datasource.hikari.idle-timeout=600000
# Maximum lifetime (ms) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000
# Name of the connection pool for monitoring
spring.datasource.hikari.pool-name=OracleDBPool

# =============================================================================
# JPA / Hibernate Configuration for Oracle
# =============================================================================
# Use Oracle12cDialect for Oracle 12c and above (compatible with 19c, 21c, 23c)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# DDL auto strategy: update will create/alter tables automatically
# Use 'validate' or 'none' in production environments
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements in logs for debugging (disable in production)
spring.jpa.show-sql=true
# Format SQL output for better readability in logs
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Spring Boot Actuator Configuration
# =============================================================================
# Expose health and info endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics
# Include database health check details in health endpoint
management.endpoint.health.show-details=always

# =============================================================================
# Logging Configuration
# =============================================================================
# Set logging level for the application package
logging.level.com.banking.oracle=DEBUG
# Log SQL parameter values for debugging (disable in production)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# OpenAPI / Swagger Configuration
# =============================================================================
# Custom API docs path
springdoc.api-docs.path=/api-docs
# Custom Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
