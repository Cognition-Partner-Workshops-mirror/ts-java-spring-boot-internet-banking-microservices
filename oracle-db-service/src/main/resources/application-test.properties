# =============================================================================
# Test Profile Configuration
# =============================================================================
# Uses H2 in-memory database instead of Oracle for unit/integration testing

# H2 in-memory database with Oracle compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA settings for test profile
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
